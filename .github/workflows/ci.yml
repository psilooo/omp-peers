name: CI

on:
  push:
    branches:
      - main
      - production-hardening
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:clean
      - run: npm run check:dist
      - run: npm test
      - run: npm run check:release
      - run: npm run check:pack

  bun-floor:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run build:clean
      - run: npm run check:dist
      - name: Extracted package activates under Bun 1.3.14
        run: |
          set -euo pipefail
          node scripts/check-pack.mjs --output "$RUNNER_TEMP/omp-peers-bun.tgz"
          mkdir -p "$RUNNER_TEMP/omp-peers-bun-extract"
          tar -xzf "$RUNNER_TEMP/omp-peers-bun.tgz" -C "$RUNNER_TEMP/omp-peers-bun-extract"
          bun scripts/smoke-host.mjs --entry "$RUNNER_TEMP/omp-peers-bun-extract/package/dist/extension.js" --scenario all
      - run: npm run test:bun

  pinned-host-floor:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run build:clean
      - name: Install the real OMP 18.2.6 distribution into a temporary prefix
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/omp-floor" --no-save @oh-my-pi/pi-coding-agent@18.2.6
          node -e 'const v = require(process.env.RUNNER_TEMP + "/omp-floor/node_modules/@oh-my-pi/pi-coding-agent/package.json").version; if (v !== "18.2.6") { console.error("expected OMP 18.2.6, installed " + v); process.exit(1); }'
          echo "$RUNNER_TEMP/omp-floor/node_modules/.bin" >> "$GITHUB_PATH"
      - name: OMP CLI parses and discovers the local plugin catalog
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/omp-agent-dir
          OMP_PEERS_DIR: ${{ runner.temp }}/omp-peers-state
        run: |
          set -euo pipefail
          mkdir -p "$PI_CODING_AGENT_DIR"
          omp plugin marketplace add "$GITHUB_WORKSPACE"
          VERSION=$(node -p "require('./package.json').version")
          omp plugin discover | tee "$RUNNER_TEMP/discover.txt"
          grep -F "omp-peers@$VERSION" "$RUNNER_TEMP/discover.txt"
      - name: Activate the packed and extracted plugin
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/omp-agent-dir
          OMP_PEERS_DIR: ${{ runner.temp }}/omp-peers-state
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          node scripts/check-pack.mjs --output "$RUNNER_TEMP/omp-peers-floor.tgz"
          mkdir -p "$RUNNER_TEMP/omp-peers-extract"
          tar -xzf "$RUNNER_TEMP/omp-peers-floor.tgz" -C "$RUNNER_TEMP/omp-peers-extract"
          omp plugin install "$RUNNER_TEMP/omp-peers-extract/package"
          omp plugin list --json | jq -e --arg v "$VERSION" 'any(.npm[]; .name == "omp-peers" and .version == $v)'
      - name: Load dist/extension.js through the OMP CLI
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/omp-agent-dir
          OMP_PEERS_DIR: ${{ runner.temp }}/omp-peers-state
        run: |
          set -euo pipefail
          EXT="$GITHUB_WORKSPACE/dist/extension.js"
          test -f "$EXT"
          omp models -e "$EXT"
          if [ -e "$OMP_PEERS_DIR" ] && [ -n "$(ls -A "$OMP_PEERS_DIR")" ]; then
            echo "peer state was created outside an arming top-level session"
            exit 1
          fi
      - name: Prove supported arming and incompatible fail-closed rejection
        run: |
          set -euo pipefail
          # smoke:host arms at 18.2.6 and keeps unknown/malformed, <18.2.6, and 19.0.0 inert.
          npm run smoke:host
